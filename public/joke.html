<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Random Joke Generator</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; display:flex; align-items:center; justify-content:center; min-height:100vh; background: #f8fafc; margin:0 }
    .card { background:white; padding:24px; border-radius:12px; box-shadow:0 8px 24px rgba(16,24,40,0.08); max-width:720px; width:100%; text-align:center }
    h1 { margin:0 0 12px 0 }
    p { font-size:1.1rem }
    button { margin-top:16px; padding:10px 16px; border-radius:8px; border:0; background:#2563eb; color:white; cursor:pointer }
    button:active { transform:translateY(1px) }
    .meta { color:#6b7280; font-size:0.9rem; margin-top:8px }
  </style>
</head>
<body>
  <div class="card">
    <h1>Random Joke Generator</h1>
    <p id="joke">Click the button to fetch a random joke.</p>
    <div class="meta" id="meta"></div>
    <div>
      <button id="new">Get a new joke</button>
      <button id="copy">Copy</button>
    </div>
  </div>

  <script>
    // Uses icanhazdadjoke (simple, no API key)
    const jokeEl = document.getElementById('joke')
    const metaEl = document.getElementById('meta')
    const newBtn = document.getElementById('new')
    const copyBtn = document.getElementById('copy')

    async function fetchJoke() {
      jokeEl.textContent = 'Loading...'
      metaEl.textContent = ''
      try {
        const res = await fetch('https://icanhazdadjoke.com/', {
          headers: { Accept: 'application/json' }
        })
        if (!res.ok) throw new Error(res.status)
        const data = await res.json()
        jokeEl.textContent = data.joke
        metaEl.textContent = `Source: icanhazdadjoke.com | id: ${data.id}`
      } catch (err) {
        jokeEl.textContent = 'Could not fetch a joke right now. Try again.'
        console.error(err)
      }
    }

    newBtn.addEventListener('click', fetchJoke)
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(jokeEl.textContent)
        copyBtn.textContent = 'Copied!'
        setTimeout(() => (copyBtn.textContent = 'Copy'), 1200)
      } catch(e) {
        console.error('copy failed', e)
      }
    })

    // Load one on open
    fetchJoke()
  </script>
</body>
</html>
